name: Setup or usage question
description: Ask for help installing, configuring, or operating Sentrovia.
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Share only sanitized configuration and logs. Never include secrets, cookies, tokens, private monitor URLs, SMTP credentials, webhook URLs, or customer data.
  - type: input
    id: version
    attributes:
      label: Sentrovia version
      description: Use the release tag, image tag, or commit SHA.
      placeholder: v0.1.1 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Windows with NSSM
        - Manual Node.js services
        - Local development
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Explain the goal, what you tried, and where the documented path stopped working.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add relevant logs or configuration with every sensitive value removed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I checked the README and deployment guide first.
          required: true
        - label: I removed all secrets, private addresses, and customer data.
          required: true
        - label: This is not a security vulnerability.
          required: true
