name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      AUTH_SECRET: 7fba94f410b741aab935de3bc2b683642ba7a0de99484292af271afce0dbda27
      APP_ENCRYPTION_SECRET: 2753237075824ec8a62d72aefcedbdad69bf27e42e84475a83cd808022233644
      DATABASE_URL: postgresql://sentrovia:sentrovia@localhost:5432/sentrovia_ci
      DISABLE_EMBEDDED_WORKER_SPAWN: "true"
      BENCHMARK_MONITORS: "1000"
      BENCHMARK_ITERATIONS: "5"

    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: sentrovia
          POSTGRES_PASSWORD: sentrovia
          POSTGRES_DB: sentrovia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentrovia -d sentrovia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate database schema and migrations
        run: npm run db:sync

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run scale benchmark smoke test
        run: npm run benchmark:scale

      - name: Build production application
        run: npm run build
